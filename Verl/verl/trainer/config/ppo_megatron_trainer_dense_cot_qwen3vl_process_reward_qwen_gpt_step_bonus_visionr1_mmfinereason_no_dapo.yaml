defaults:
  - ppo_megatron_trainer_dense_cot_qwen3vl_process_reward_qwen_gpt_step_bonus
  - _self_

reward:
  custom_reward_function:
    reward_kwargs:
      # VisionR1-mmfinereason train set step stats:
      # - vision_r1_rl: p50=5, p75=6, p90=7, p95=9
      # - mmfinereason: p50=5, p75=6, p90=7, p95=8
      process_gamma: 1.5
      step_bonus_lambda: 0.3
      deep_exploration_bonus_lambda: 0.12
      deep_exploration_step_cap: 4
      deep_exploration_difficulty_threshold: 8
      deep_exploration_difficulty_cap: 18
      deep_exploration_difficulty_by_source:
        vision_r1_rl:
          threshold: 6
          cap: 9
        mmfinereason:
          threshold: 6
          cap: 8
      hallucination_penalty_ratio: 0.5

data:
  train_files: data/VisionR1-mmfinereason/train.parquet
  val_files: data/VisionR1-mmfinereason/test.parquet
